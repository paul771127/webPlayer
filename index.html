<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0f12">
<title>webPlayer</title>
<style>
  /* 版面：上方網址列 → 中間純影片區（無任何覆蓋圖示）→ 下方控制列（影片外） */
  :root {
    --bg: #0d0f12;
    --bar: #16191e;
    --fg: #e7e9ec;
    --muted: #8a919b;
    --line: #2a2f37;
    --accent: #4f8cff;
    --font: "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--fg); font: 14px/1.4 var(--font);
    display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none;
  }
  button, select, input { font: inherit; color: var(--fg); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* 上方網址列 */
  #bar {
    display: flex; gap: 8px; align-items: center;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
    background: var(--bar); border-bottom: 1px solid var(--line);
  }
  #url {
    flex: 1; min-width: 0; background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px;
  }
  .btn {
    background: var(--accent); color: #fff; border: 0; border-radius: 6px;
    padding: 9px 14px; cursor: pointer; white-space: nowrap;
  }
  #msg { padding: 6px 16px; color: var(--muted); font-size: 12px; background: var(--bar); }
  #msg:empty { display: none; }

  /* 影片區 */
  #stage { position: relative; flex: 1; min-height: 0; background: #000; overflow: hidden; }
  #player, #stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #touch {
    position: absolute; inset: 0; z-index: 2; background: transparent;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* 下方控制列 */
  #ctrl {
    display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    background: var(--bar); border-top: 1px solid var(--line);
  }
  .group { display: flex; align-items: center; gap: 8px; }
  .label { color: var(--muted); font-size: 12px; letter-spacing: .04em; }
  .stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .stepper button {
    width: 36px; height: 36px; background: transparent; border: 0; cursor: pointer; font-size: 18px;
  }
  .stepper button:active { background: var(--line); }
  #stepVal { min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; }
  select {
    height: 36px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 0 8px;
  }
  #fsBtn { height: 36px; padding: 0 14px; }
  .toggle { cursor: pointer; }
  .toggle input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }

  /* 全螢幕：只留影片 */
  body.fs #bar, body.fs #msg, body.fs #ctrl { display: none; }
  body.fs { background: #000; }
  :root:has(body.fs) { padding: 0; }
  /* 影片區直接貼齊「目前可見的畫面」，旋轉或網址列收合時自動跟著縮放，不會超出 */
  /* 尺寸由 JS 依實際可見畫面寫入 --appW / --appH，旋轉後重新量測 */
  body.fs { position: fixed; inset: 0; overflow: hidden; }
  body.fs #stage {
    position: fixed; top: 0; left: 0; z-index: 10;
    width: var(--appW, 100vw); height: var(--appH, 100vh);
  }
</style>
</head>
<body>
  <form id="bar" autocomplete="off">
    <input id="url" type="text" inputmode="url" placeholder="貼上 YouTube 網址或影片 ID"
           value="https://www.youtube.com/watch?v=aqz-KE-bpKQ">
    <button class="btn" type="submit">播放</button>
  </form>
  <div id="msg"></div>

  <div id="stage">
    <div id="player"></div>
    <div id="touch"></div>
  </div>

  <div id="ctrl">
    <div class="group">
      <span class="label">快進／後退</span>
      <div class="stepper">
        <button type="button" id="stepDown" aria-label="減少秒數">−</button>
        <span id="stepVal">5 秒</span>
        <button type="button" id="stepUp" aria-label="增加秒數">+</button>
      </div>
    </div>
    <div class="group">
      <label class="label" for="rate">速度</label>
      <select id="rate">
        <option value="0.25">0.25×</option>
        <option value="0.5">0.5×</option>
        <option value="0.75">0.75×</option>
        <option value="1" selected>1×</option>
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option>
        <option value="1.75">1.75×</option>
        <option value="2">2×</option>
      </select>
    </div>
    <label class="group toggle" for="resume">
      <input type="checkbox" id="resume">
      <span class="label">記住播放進度</span>
    </label>
    <button type="button" class="btn" id="fsBtn">全螢幕</button>
  </div>

<script>
/* ========== 設定 ========== */
const STEPS = [1, 2, 3, 5, 10, 15, 20, 30, 60];
const CFG = { swipeMin: 40, volPerPx: 0.25, tapMaxMove: 10, doubleTapMs: 300, mergeMs: 600 };

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let stepIdx = STEPS.indexOf(store.get('step', 5)); if (stepIdx < 0) stepIdx = 3;
let rate = store.get('rate', 1);

const $ = id => document.getElementById(id);
const msg = t => { $('msg').textContent = t || ''; };

/* ========== 網址解析 ========== */
function parseId(input) {
  const s = input.trim();
  if (/^[\w-]{11}$/.test(s)) return s;
  try {
    const u = new URL(s.startsWith('http') ? s : 'https://' + s);
    if (u.hostname.includes('youtu.be')) return u.pathname.slice(1, 12);
    if (u.searchParams.get('v')) return u.searchParams.get('v');
    const m = u.pathname.match(/\/(embed|shorts|live|v)\/([\w-]{11})/);
    if (m) return m[2];
  } catch (e) {}
  return null;
}

/* ========== YouTube 播放器 ========== */
let player = null, ready = false, pendingId = null, pendingCue = null;

window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('player', {
    playerVars: { controls: 0, disablekb: 1, fs: 0, rel: 0, iv_load_policy: 3, playsinline: 1, cc_load_policy: 0 },
    events: {
      onReady: () => {
        ready = true;
        if (pendingId) load(pendingId);
        else if (pendingCue) player.cueVideoById({ videoId: pendingCue, startSeconds: Resume.startFor(pendingCue) });
      },
      onStateChange: e => {
        // 換影片後 YouTube 會把速度重設回 1×，這裡補回使用者設定
        if (e.data === YT.PlayerState.PLAYING && player.getPlaybackRate() !== rate) player.setPlaybackRate(rate);
        if (e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED) Resume.save();
      },
      onError: e => msg('無法播放（錯誤碼 ' + e.data + '）：影片可能不允許嵌入。')
    }
  });
};
(() => { const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s); })();

function load(id) {
  if (!ready) { pendingId = id; return; }
  msg('');
  const start = Resume.startFor(id);
  player.loadVideoById({ videoId: id, startSeconds: start });
}

/* ========== 播放進度記憶（可開關） ========== */
const Resume = (() => {
  const KEY = 'progress', MAX = 50;
  let on = store.get('resumeOn', true);
  const all = () => store.get(KEY, { last: null, items: {} });
  const curId = () => { try { return player.getVideoData().video_id || null; } catch (e) { return null; } };

  function save() {
    if (!on || !ready) return;
    const id = curId(); if (!id) return;
    const t = player.getCurrentTime(), dur = player.getDuration();
    const d = all();
    if (dur && t > dur - 10) delete d.items[id];           // 看完了就不再續播
    else if (t > 3) d.items[id] = { t: Math.floor(t), at: Date.now() };
    d.last = id;
    const ids = Object.keys(d.items).sort((a, b) => d.items[b].at - d.items[a].at);
    ids.slice(MAX).forEach(k => delete d.items[k]);        // 只保留最近 50 部
    store.set(KEY, d);
  }
  return {
    get on() { return on; },
    set(v) { on = v; store.set('resumeOn', v); if (v) save(); },
    startFor: id => (on && all().items[id]) ? all().items[id].t : 0,
    lastId: () => on ? all().last : null,
    save
  };
})();

$('resume').checked = Resume.on;
$('resume').onchange = e => Resume.set(e.target.checked);
setInterval(() => { if (ready && player.getPlayerState() === YT.PlayerState.PLAYING) Resume.save(); }, 3000);
window.addEventListener('pagehide', Resume.save);
document.addEventListener('visibilitychange', () => { if (document.hidden) Resume.save(); });

// 開啟頁面時：帶出上次的影片，停在上次的位置（手機需點一下才會出聲播放）
const lastId = Resume.lastId();
if (lastId) {
  $('url').value = 'https://youtu.be/' + lastId;
  pendingCue = lastId;
}
$('bar').addEventListener('submit', e => {
  e.preventDefault();
  const id = parseId($('url').value);
  if (!id) { msg('看不懂這個網址，請貼 youtube.com / youtu.be 連結或 11 碼影片 ID。'); return; }
  load(id);
});

/* ========== 動作 ========== */
// 連續快速滑動時合併成一次跳轉，減少 YouTube 重複緩衝
let seekTarget = null, seekAt = 0;
function seek(delta) {
  if (!ready) return;
  const now = Date.now();
  const base = (seekTarget !== null && now - seekAt < CFG.mergeMs) ? seekTarget : player.getCurrentTime();
  const dur = player.getDuration() || Infinity;
  seekTarget = Math.min(Math.max(base + delta, 0), dur - 0.5);
  seekAt = now;
  player.seekTo(seekTarget, true);
}
function setVol(v) {
  if (!ready) return;
  v = Math.round(Math.min(Math.max(v, 0), 100));
  if (player.isMuted() && v > 0) player.unMute();
  player.setVolume(v);
}
function togglePlay() {
  if (!ready) return;
  player.getPlayerState() === YT.PlayerState.PLAYING ? player.pauseVideo() : player.playVideo();
}

/* ========== 下方控制列 ========== */
function renderStep() { $('stepVal').textContent = STEPS[stepIdx] + ' 秒'; store.set('step', STEPS[stepIdx]); }
$('stepDown').onclick = () => { if (stepIdx > 0) { stepIdx--; renderStep(); } };
$('stepUp').onclick = () => { if (stepIdx < STEPS.length - 1) { stepIdx++; renderStep(); } };
renderStep();

$('rate').value = String(rate);
$('rate').onchange = e => {
  rate = parseFloat(e.target.value); store.set('rate', rate);
  if (ready) player.setPlaybackRate(rate);
};

/* ========== 全螢幕 ========== */
// 有原生全螢幕就用（Android / 桌機），沒有（iPhone）就用網頁內全螢幕
const isFs = () => document.body.classList.contains('fs');
async function enterFs() {
  document.body.classList.add('fs');
  fitViewport();
  const el = document.documentElement;
  try {
    if (el.requestFullscreen) await el.requestFullscreen({ navigationUI: 'hide' });
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  } catch (e) {}
}
async function exitFs() {
  document.body.classList.remove('fs');
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else if (document.webkitFullscreenElement) document.webkitExitFullscreen();
  } catch (e) {}
  onRotate();
}
const toggleFs = () => (isFs() ? exitFs() : enterFs());

/* 旋轉時：瀏覽器常沿用直向的尺寸或自動放大，這裡強制重新量測並還原縮放 */
const vpMeta = document.querySelector('meta[name=viewport]');
function fitViewport() {
  const vv = window.visualViewport;
  const w = Math.round(vv ? vv.width : window.innerWidth);
  const h = Math.round(vv ? vv.height : window.innerHeight);
  const r = document.documentElement.style;
  r.setProperty('--appW', w + 'px');
  r.setProperty('--appH', h + 'px');
  window.scrollTo(0, 0);
}
function onRotate() {
  const c = vpMeta.content;                       // 重設 viewport 讓 iOS 取消旋轉時的自動放大
  vpMeta.content = c + ', width=device-width';
  vpMeta.content = c;
  [0, 150, 400, 800].forEach(ms => setTimeout(fitViewport, ms)); // 部分手機旋轉後尺寸會晚一點才更新
}
window.addEventListener('orientationchange', onRotate);
window.addEventListener('resize', fitViewport);
if (window.visualViewport) visualViewport.addEventListener('resize', fitViewport);
if (screen.orientation) screen.orientation.addEventListener('change', onRotate);
fitViewport();
$('fsBtn').onclick = toggleFs;
// 用系統返回鍵 / Esc 離開原生全螢幕時，同步回視窗模式
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev =>
  document.addEventListener(ev, () => {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) document.body.classList.remove('fs');
  }));

/* ========== 手勢 ========== */
const pad = $('touch');
let g = null, lastTap = 0, tapTimer = null, holdTimer = null;
const HOLD_MS = 700;

pad.addEventListener('pointerdown', e => {
  pad.setPointerCapture(e.pointerId);
  g = { x0: e.clientX, y0: e.clientY, axis: null, held: false, vol0: ready ? player.getVolume() : 100 };
  // 全螢幕時長按 0.7 秒：退回視窗模式（備用方式）
  clearTimeout(holdTimer);
  holdTimer = setTimeout(() => { if (g && !g.axis && isFs()) { g.held = true; exitFs(); } }, HOLD_MS);
});
pad.addEventListener('pointermove', e => {
  if (!g) return;
  const dx = e.clientX - g.x0, dy = e.clientY - g.y0;
  if (!g.axis && Math.hypot(dx, dy) > CFG.tapMaxMove) { g.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y'; clearTimeout(holdTimer); }
  if (g.axis === 'y') setVol(g.vol0 - dy * CFG.volPerPx);
});
pad.addEventListener('pointerup', e => {
  clearTimeout(holdTimer);
  if (!g) return;
  if (g.held) { g = null; return; }
  const dx = e.clientX - g.x0;
  if (g.axis === 'x' && Math.abs(dx) >= CFG.swipeMin) {
    seek(dx > 0 ? STEPS[stepIdx] : -STEPS[stepIdx]);
  } else if (!g.axis) {
    const now = Date.now();
    if (now - lastTap < CFG.doubleTapMs) { clearTimeout(tapTimer); lastTap = 0; toggleFs(); } // 雙擊：切換全螢幕
    else { lastTap = now; tapTimer = setTimeout(togglePlay, CFG.doubleTapMs); }             // 單擊：播放／暫停
  }
  g = null;
});
pad.addEventListener('pointercancel', () => { clearTimeout(holdTimer); g = null; });

/* 桌機鍵盤 */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const map = {
    ArrowRight: () => seek(STEPS[stepIdx]), ArrowLeft: () => seek(-STEPS[stepIdx]),
    ArrowUp: () => setVol(player.getVolume() + 10), ArrowDown: () => setVol(player.getVolume() - 10),
    ' ': togglePlay, f: toggleFs
  };
  if (map[e.key] && ready) { e.preventDefault(); map[e.key](); }
});
</script>
</body>
</html>
